<?xml version="1.0" encoding="UTF-8"?>
<!-- Inside Narrative Media — Horizontal Lockup (icon + wordmark) -->
<svg viewBox="0 0 520 80" xmlns="http://www.w3.org/2000/svg" width="520" height="80" role="img" aria-label="Inside Narrative Media">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=clash-display@700&amp;display=swap');
    </style>
  </defs>
  <!-- Play button icon mark -->
  <rect x="0" y="8" width="64" height="64" rx="8" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5"/>
  <polygon points="24,24 24,56 50,40" fill="#e8e8e8"/>
  <!-- Wordmark -->
  <text x="84" y="30" fill="#e8e8e8" font-family="'Clash Display', 'Arial Black', sans-serif" font-weight="700" font-size="22" letter-spacing="3">INSIDE</text>
  <text x="84" y="58" fill="#e8e8e8" font-family="'Clash Display', 'Arial Black', sans-serif" font-weight="700" font-size="22" letter-spacing="3">NARRATIVE</text>
  <!-- Tagline rule -->
  <line x1="84" y1="65" x2="84" y2="65" stroke="#555555" stroke-width="1"/>
  <text x="84" y="75" fill="#555555" font-family="'Arial', sans-serif" font-weight="400" font-size="9" letter-spacing="2.5">MEDIA · PHOENIX, AZ</text>
</svg>
